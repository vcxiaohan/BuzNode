# 服务器上用的编排文件：只从镜像仓库拉取镜像运行，服务器上不放源代码、不构建
# REGISTRY、NAMESPACE、IMAGE_TAG 由部署脚本写进同目录的 .env，这样手动执行 docker compose logs、restart 时也用同一个版本
# Redis 用云 Redis，地址在 .env.production 里，所以这里没有 redis 服务

# Docker 默认不限制日志文件大小，必须配置，否则日志会把磁盘写满
x-logging: &logging
  driver: json-file
  options:
    max-size: "100m" # 单个日志文件最大 100MB
    max-file: "3" # 最多保留 3 个，超出后删除最旧的

services:
  bff:
    image: ${REGISTRY:?}/${NAMESPACE:?}/buz-node:${IMAGE_TAG:?}
    env_file: .env.production
    ports:
      - "3000:3000"
    # 用一个很小的 init 进程当 1 号进程，负责转发信号、回收僵尸进程
    init: true
    restart: unless-stopped
    # docker stop 默认等 10 秒就强制杀掉，要比代码里的强制退出时间（15 秒）长
    stop_grace_period: 20s
    logging: *logging
    depends_on:
      - mock

  # 模拟的下游服务，有真实的订单、商品、广告服务后去掉
  mock:
    image: ${REGISTRY:?}/${NAMESPACE:?}/buz-node-mock:${IMAGE_TAG:?}
    # 只暴露认证服务给本机，方便登录拿 token；订单、商品、广告服务只在 compose 内部网络里访问
    ports:
      - "127.0.0.1:4004:4004"
    init: true
    restart: unless-stopped
    logging: *logging
